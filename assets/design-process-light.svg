<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
<title id="title">Design and AI development workflow</title>
<desc id="desc">Brainstorm, research, and decide whether the direction is clear. Return to research if not. Develop with AI and review in a text editor, then polish and debug. Review and repeat polishing as needed, or return to research to revisit assumptions. When ready, deliver or update the product, gather feedback through a survey, interview, or usability test, and iterate toward the next version. A dashed outer arrow leads from Iterate back to Research when further research is needed.</desc>
