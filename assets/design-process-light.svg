<text x="130" y="188" text-anchor="middle" font-size="21" font-weight="400" fill="#251C32">Brainstorm</text>
<text x="380" y="188" text-anchor="middle" font-size="23" font-weight="400" fill="#251C32">Research</text>
<text x="660" y="175" text-anchor="middle" font-size="22" font-weight="400" fill="#251C32">Direction</text>
<text x="660" y="201" text-anchor="middle" font-size="22" font-weight="400" fill="#251C32">clear?</text>
<text x="1115" y="174" text-anchor="middle" font-size="24" font-weight="400" fill="#251C32">Develop with AI</text>
<text x="1115" y="207" text-anchor="middle" font-size="21" font-weight="400" fill="#251C32">Review in text editor</text>
<text x="1115" y="463" text-anchor="middle" font-size="24" font-weight="400" fill="#251C32">Polish</text>
<text x="1115" y="495" text-anchor="middle" font-size="24" font-weight="400" fill="#251C32">&amp; debug</text>
<text x="660" y="464" text-anchor="middle" font-size="23" font-weight="600" fill="#251C32">Review</text>
<text x="660" y="492" text-anchor="middle" font-size="19" font-weight="400" fill="#251C32">Ready to deliver?</text>
<text x="380" y="753" text-anchor="middle" font-size="24" font-weight="400" fill="#251C32">Deliver / update</text>
<text x="770" y="718" text-anchor="middle" font-size="23" font-weight="600" fill="#251C32">Gather feedback</text>
<text x="770" y="753" text-anchor="middle" font-size="21" font-weight="400" fill="#251C32">Survey, interview,</text>
<text x="770" y="782" text-anchor="middle" font-size="21" font-weight="400" fill="#251C32">or usability test</text>
<text x="1150" y="737" text-anchor="middle" font-size="24" font-weight="400" fill="#251C32">Iterate</text>
<text x="1150" y="768" text-anchor="middle" font-size="20" font-weight="400" fill="#251C32">Next version</text>
<text x="860" y="164" text-anchor="middle" font-size="19" font-weight="400" fill="#7345AE">Yes</text>
<text x="535" y="285" text-anchor="middle" font-size="19" font-weight="400" fill="#7345AE">Not yet</text>
<text x="850" y="333" text-anchor="middle" font-size="19" font-weight="400" fill="#7345AE">Needs refinement</text>
<text x="448" y="451" text-anchor="middle" font-size="19" font-weight="400" fill="#7345AE">Revisit assumptions</text>
<text x="700" y="591" text-anchor="middle" font-size="19" font-weight="400" fill="#7345AE">Ready</text>
<text x="1050" y="68" text-anchor="middle" font-size="19" font-weight="400" fill="#7345AE">Further research needed</text>
